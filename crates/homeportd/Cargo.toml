[package]
name = "homeportd"
description = "Homeport server: serves folders over QUIC on the tailnet (macOS; Linux and Windows in progress)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
homeport-proto.workspace = true
bytes.workspace = true
clap.workspace = true
lru.workspace = true
quinn.workspace = true
rand.workspace = true
rcgen.workspace = true
rusqlite.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
unicode-normalization.workspace = true
zstd.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# sendmsg_x/recvmsg_x batching on macOS: several times the packet rate at a 1232-byte MTU.
quinn-udp.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
# statx, getdents64, openat2, renameat2, inotify, xattrs, FICLONE.
rustix = { version = "1.1", features = ["fs", "event", "time"] }
# Server-side thumbnails of raster images (no Quick Look on Linux).
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

[lints]
workspace = true
